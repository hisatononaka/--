backbone_name: "vit_small"
hidden_dim: 2048
bottleneck_dim: 256
output_dim: 128
lr: 0.06
warmup_epochs: 20
weight_decay: 1e-5
momentum: 0.9
global_size: 128 # global crop。ViT の基準 img_size にもなる。
local_size: 48 # local crop（multicrop 時）。dynamic_img_size=True なら 128 と異なるサイズも可
multicrop: True
n_views: 0
use_adapter: true
token_patch_size: 4 # ViT の 1 patch のピクセル数（4 → 128/4=32, 48/4=12 tokens）
dynamic_img_size: true # ViT で可変解像度対応（pos embed 補間）。global(128) と local(48) を両方受け付ける
